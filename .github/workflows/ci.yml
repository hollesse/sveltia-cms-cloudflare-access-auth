# CI prueft, deployt aber nicht (ADR 0007): kein Deploy-Job, kein
# CLOUDFLARE_API_TOKEN — Forks laufen ohne Secrets gruen. Deploy ist
# Betreiber-Sache (`wrangler deploy` lokal).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal token scope: CI only reads the repo (ADR 0007 — no deploy, no writes).
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (Workers runtime, mocked upstreams)
        run: npm test

      - name: Deploy dry-run (bundle check, no upload)
        run: npx wrangler deploy --dry-run
